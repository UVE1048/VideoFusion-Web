name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile Python sources
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            python -m compileall -q .
            echo "Python sources compile cleanly."
          else
            echo "No Python sources in this repository."
          fi

      - name: Validate metadata files
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import glob, json, sys
          import yaml

          failed = False
          for p in sorted(glob.glob("*.json")):
              try:
                  json.load(open(p, encoding="utf-8"))
                  print("json ok:", p)
              except Exception as exc:
                  print("json FAIL:", p, exc)
                  failed = True
          for p in sorted(glob.glob("*.cff")):
              try:
                  yaml.safe_load(open(p, encoding="utf-8"))
                  print("cff ok:", p)
              except Exception as exc:
                  print("cff FAIL:", p, exc)
                  failed = True
          sys.exit(1 if failed else 0)
          PY
